name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Four clients read four different manifests off one skills/ folder.
      # This is what notices when they drift.
      - run: node scripts/check.mjs
